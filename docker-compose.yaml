services:
  db:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: fastapi_app
    working_dir: /app                          # ← Çalışma dizini
    command: uvicorn app.main:app --host 0.0.0.0 --port ${FASTAPI_PORT} --reload
    ports:
      - "${FASTAPI_PORT}:${FASTAPI_PORT}"
    depends_on:
      db:
        condition: service_healthy             # ← DB sağlıklı olunca başla
    env_file:
      - .env
    volumes:
      - ./:/app                                # ← Hot-reload için kaynak kodu mount

volumes:
  pgdata: